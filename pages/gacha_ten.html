<title>神兵匣 - 抽奖结果</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
.stage{position:relative;width:2340px;height:1080px;transform-origin:top left;overflow:hidden}
.bg-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
/* 道具格子 */
.item-slot{position:absolute;width:200px;height:200px;opacity:0;transform:scale(1.5)}
.item-slot .slot-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.item-slot .item-img{position:absolute;inset:15px;width:calc(100% - 30px);height:calc(100% - 30px);object-fit:contain;display:block;z-index:2;}
.item-slot .item-name{position:absolute;left:-40px;right:-40px;top:210px;text-align:center;font-size:26px;font-weight:bold;color:#000;text-shadow:0 0 3px #fff,0 0 6px #fff;z-index:3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* 飞入动画 */
.item-slot.fly-in{animation:flyIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards}
/* 白色品质光晕 */
.item-slot.quality-white::after{content:'';position:absolute;inset:-20px;border-radius:12px;background:radial-gradient(circle,rgba(150,200,255,0.9),rgba(100,180,255,0.4) 40%,transparent 70%);animation:glowWhite 0.8s ease-out forwards;pointer-events:none}
/* 紫色品质光晕 */
.item-slot.quality-purple::after{content:'';position:absolute;inset:-20px;border-radius:12px;background:radial-gradient(circle,rgba(200,150,255,0.9),rgba(160,100,255,0.4) 40%,transparent 70%);animation:glowPurple 0.8s ease-out forwards;pointer-events:none}
/* 金色品质 */
@property --gold-angle{
  syntax:'<angle>';
  initial-value:0deg;
  inherits:false;
}
.item-slot.quality-gold.fly-in{animation:flyInGold 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards}
.item-slot.quality-gold::before{content:'';position:absolute;inset:-15px;border-radius:6px;background:radial-gradient(circle,rgba(255,220,100,1),rgba(255,180,50,0.6) 30%,rgba(255,150,0,0.3) 60%,transparent 80%);animation:glowGold 1.2s ease-out forwards;pointer-events:none}
.item-slot.quality-gold::after{content:'';position:absolute;inset:-12px;border-radius:6px;background:conic-gradient(from var(--gold-angle),transparent,rgba(255,215,0,0.28),transparent 25%,rgba(255,215,0,0.28),transparent 50%,rgba(255,215,0,0.28),transparent 75%,rgba(255,215,0,0.28),transparent);animation:rotateGoldAngle 5s linear infinite;pointer-events:none}
/* 金色粒子 */
.gold-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.gold-particle{position:absolute;width:6px;height:6px;background:radial-gradient(circle,#ffd700,#ff8c00);border-radius:50%;animation:particleFloat 1.5s ease-out forwards}
/* 红色品质 */
@property --red-angle{
  syntax:'<angle>';
  initial-value:0deg;
  inherits:false;
}
.item-slot.quality-red.fly-in{animation:flyInRed 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards}
.item-slot.quality-red::before{content:'';position:absolute;inset:-15px;border-radius:6px;background:radial-gradient(circle,rgba(200,50,50,1),rgba(150,30,30,0.6) 30%,rgba(100,20,20,0.3) 60%,transparent 80%);animation:glowRed 1.2s ease-out forwards;pointer-events:none}
.item-slot.quality-red::after{content:'';position:absolute;inset:-12px;border-radius:6px;background:conic-gradient(from var(--red-angle),transparent,rgba(200,50,50,0.28),transparent 25%,rgba(200,50,50,0.28),transparent 50%,rgba(200,50,50,0.28),transparent 75%,rgba(200,50,50,0.28),transparent);animation:rotateRedAngle 5s linear infinite;pointer-events:none}
/* 红色粒子 */
.red-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.red-particle{position:absolute;width:6px;height:6px;background:radial-gradient(circle,#c83232,#641414);border-radius:50%;animation:particleFloat 1.5s ease-out forwards}
@keyframes flyInRed{
  0%{opacity:0;transform:scale(2) translateY(-40px)}
  60%{opacity:1;transform:scale(0.95)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes glowRed{
  0%{opacity:0;transform:scale(0.5)}
  50%{opacity:1;transform:scale(1.2)}
  100%{opacity:0.8;transform:scale(1)}
}
@keyframes rotateRedAngle{
  to{--red-angle:360deg}
}

@keyframes flyIn{
  0%{opacity:0;transform:scale(2) translateY(-40px)}
  30%{opacity:1;transform:scale(1.1) translateY(0)}
  60%{transform:scale(0.95)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
@keyframes flyInGold{
  0%{opacity:0;transform:scale(2.5) translateY(-50px) rotate(-10deg)}
  20%{opacity:1;transform:scale(1.2) translateY(0) rotate(5deg)}
  50%{transform:scale(0.9) rotate(-3deg)}
  80%{transform:scale(1.05) rotate(1deg)}
  100%{opacity:1;transform:scale(1) translateY(0) rotate(0)}
}
@keyframes glowWhite{
  0%{opacity:0;transform:scale(1.5)}
  30%{opacity:1;transform:scale(1.2)}
  100%{opacity:0;transform:scale(1)}
}
@keyframes glowPurple{
  0%{opacity:0;transform:scale(1.5)}
  30%{opacity:1;transform:scale(1.2)}
  100%{opacity:0;transform:scale(1)}
}
@keyframes glowGold{
  0%{opacity:0;transform:scale(2)}
  20%{opacity:1;transform:scale(1.5)}
  50%{opacity:0.8;transform:scale(1.3)}
  100%{opacity:0;transform:scale(1)}
}
@keyframes rotateGoldAngle{
  to{--gold-angle:360deg}
}
@keyframes particleFloat{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}
}
/* 确认按钮 */
.confirm-btn{position:absolute;left:40%;top:82%;width:20%;height:10%;background:transparent;border:none;cursor:pointer;z-index:100}
</style>

  <!-- 道具名称（动态叠加） -->
  <div class="item-name" id="itemName">AK47-星象</div>
  
  <!-- 武器展示 -->

<script>
// ===== 出货动画确定键音效 =====
var confirmAudioPool = [];
var confirmAudioIndex = 0;
for(var i = 0; i < 3; i++){
  var ca = new Audio('../audio/gacha/confirm.m4a');
  ca.preload = 'auto';
  confirmAudioPool.push(ca);
}
function playConfirmSound(){
  try{
    var audio = confirmAudioPool[confirmAudioIndex];
    confirmAudioIndex = (confirmAudioIndex + 1) % 3;
    audio.currentTime = 0;
    audio.play().catch(function(e){});
  }catch(e){}
}
// ===== 出货动画确定键音效结束 =====

// ===== 出货动画开始音效（第一个背景出现时播放）=====
var showcaseStartAudioPool = [];
var showcaseStartAudioIndex = 0;
for(var i = 0; i < 3; i++){
  var ssa = new Audio('../audio/gacha/showcase_start.m4a');
  ssa.preload = 'auto';
  showcaseStartAudioPool.push(ssa);
}
function playShowcaseStartSound(){
  try{
    var audio = showcaseStartAudioPool[showcaseStartAudioIndex];
    showcaseStartAudioIndex = (showcaseStartAudioIndex + 1) % 3;
    audio.currentTime = 0;
    audio.play().catch(function(e){});
  }catch(e){}
}
// ===== 出货动画开始音效结束 =====


// 自适应缩放（和项目其他页面保持一致）
function layout(){
  var s = Math.min(window.innerWidth/2340, window.innerHeight/1080);
  document.getElementById('stage').style.transform = 'scale('+s+')';
  document.getElementById('stage').style.left = (window.innerWidth - 2340*s)/2 + 'px';
  document.getElementById('stage').style.top = (window.innerHeight - 1080*s)/2 + 'px';
}
window.addEventListener('resize', layout);
layout();

// 从URL参数获取道具信息
const urlParams = new URLSearchParams(window.location.search);
let itemName = urlParams.get('name') || 'AK47-星象';
const itemImage = urlParams.get('image') || '';

// 设置武器图片和道具名称
if (itemImage && itemName !== '传说女帝') {
  document.getElementById('weaponImg').src = itemImage;
}
document.getElementById('itemName').textContent = itemName;

// 标记是否接收到了特殊背景图片
var hasCustomBg = false;

// 监听父页面的postMessage，接收道具名称（srcdoc方式用）
window.addEventListener('message', function(e){
  // 扭蛋机：接收父页面传递的十连抽道具
  if(e.data && e.data.type === 'setTenRewards' && e.data.items){
    // 防重复处理：只有在externalTenItems已经被设置了才忽略
    if(tenRewardsReady && externalTenItems && externalTenItems.length > 0) return;
    tenRewardsReady = true;
    externalTenItems = e.data.items;
    // 提前加载奖励展示背景图
    if(bgImg) bgImg.src = BG_TEN;
    // 按照品质排序道具
    var qualityOrder = {red: -1, purple: 1, white: 2, gold: 0};
    var sortedItems = externalTenItems.slice().sort(function(a, b){
      var qa = qualityOrder[a.quality] || 99;
      var qb = qualityOrder[b.quality] || 99;
      return qa - qb;
    });
    // 预加载排序后第一个有出货动画的道具
    for(var i = 0; i < sortedItems.length; i++){
      var item = sortedItems[i];
      if(item && item.name && needShowcase(item)){
        preloadShowcase(item.name, item.image);
        break;
      }
    }
    // 关键：如果已经收到了startAnimation信号（页面已显示），就立即播放
    if(startAnimationReceived && !animationStarted){
      playTen();
    }
    return;
  }
  
  // 开始播放动画信号（视频结束，页面显示后发送）
  if(e.data && e.data.type === 'startAnimation'){
    startAnimationReceived = true;
    // 直接调用playTen()，playTen()内部会自己从localStorage/父页面内存/externalTenItems/随机道具中选择
    if(!animationStarted){
      playTen();
    }
    return;
  }
  
  if(e.data && e.data.type === 'setItemName' && e.data.name){
    // 预加载模式：只设置道具信息和第一张背景图，不开始计时（等startShowcaseTiming信号）
    itemName = e.data.name;
    var itemNameEl = document.getElementById('itemName');
    if(itemNameEl){
      itemNameEl.textContent = itemName;
      // 传说女帝隐藏名称
      if(itemName === '传说女帝'){
        itemNameEl.style.display = 'none';
      }
    }
    // 如果有图片，显示道具图片（传说女帝不显示道具图片）
    if(e.data.image && e.data.name !== '传说女帝'){
      var weaponImg = document.getElementById('weaponImg');
      if(weaponImg){
        weaponImg.src = e.data.image;
      }
    }
    // 如果有背景图片，设置背景图片并显示
    if(e.data.bgStart){
      hasCustomBg = true;
      var bgStart = document.getElementById('bgStart');
      if(bgStart){
        bgStart.src = e.data.bgStart;
        bgStart.style.opacity = '1';
      }
    }
    if(e.data.bgButton){
      hasCustomBg = true;
      var bgButton = document.getElementById('bgButton');
      if(bgButton){
        bgButton.src = e.data.bgButton;
      }
    }
    // 如果没有特殊背景图片，显示默认背景图片
    if(!hasCustomBg){
      var bgStart = document.getElementById('bgStart');
      if(bgStart){
        bgStart.style.opacity = '1';
      }
    }
    // 预加载模式：不开始计时，等startShowcaseTiming信号
  }
  
  // 开始出货动画计时信号（视频结束，页面显示后发送）
  if(e.data && e.data.type === 'startShowcaseTiming'){
    playShowcaseStartSound(); // 出货动画开始，播放音效
    startShowcaseAnimation();
  }
});

// 出货动画开始：收到道具消息后才开始计时（确保第一张背景图显示足够时间）
var showcaseStarted = false;
var showcaseTimingStarted = false;
function startShowcaseAnimation(){
  if(showcaseStarted) return;
  showcaseStarted = true;
  
  var bgStart = document.getElementById('bgStart');
  
  // 等第一张背景图加载完成后再开始计时（确保用户能看到第一张背景图）
  function beginTiming(){
    if(showcaseTimingStarted) return;
    showcaseTimingStarted = true;
    // 2.3秒后切换到有按钮的背景，同时显示道具名称（同一时间基准，消除偏差）
    setTimeout(() => {
      bgStart.style.opacity = '0';
      document.getElementById('bgButton').style.opacity = '1';
      // 同时显示道具名称（和按钮背景用同一个setTimeout，消除时间偏差）
      var itemNameEl = document.getElementById('itemName');
      if(itemNameEl){
        itemNameEl.style.opacity = '1';
        itemNameEl.style.transform = 'translateX(0)';
      }
    }, 2300);
    
    // 2.6秒后确定按钮可以点击
    setTimeout(() => {
      confirmHitbox.style.opacity = '0.01'; // 几乎透明但可点击
      confirmHitbox.addEventListener('click', onConfirm);
    }, 2600);
  }
  
  // 检查bgStart图片是否已经加载完成
  if(bgStart && bgStart.src && bgStart.complete){
    // 图片已经加载完成，直接开始计时
    beginTiming();
  }else if(bgStart && bgStart.src){
    // 图片还在加载中，等加载完成后再开始计时
    bgStart.onload = function(){
      beginTiming();
    };
    // 兜底：如果图片加载超时（3秒），也开始计时
    setTimeout(function(){
      beginTiming();
    }, 3000);
  }else{
    // 没有bgStart图片（使用默认背景），直接开始计时
    beginTiming();
  }
}

// 确定按钮点击（confirmHitbox元素在HTML中定义，startShowcaseAnimation中绑定事件）
function onConfirm(){
  playConfirmSound(); // 播放出货动画确定键音效
  // 向父页面发送关闭消息
  parent.postMessage({
    type: 'closeGoldReward',
    item: itemName
  }, '*');
}

// 监听ESC键关闭
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && confirmHitbox.style.opacity !== '0'){
    onConfirm();
  }
});
</script>

<script>
// 禁止长按弹出菜单
document.addEventListener('contextmenu', function(e){
  e.preventDefault();
  return false;

// 禁止图片拖拽
document.addEventListener('dragstart', function(e){
  if(e.target.tagName === 'IMG'){
    e.preventDefault();
    return false;
  }
});
</script>

// ===== 音效系统 =====
var AUDIO_POOL_SIZE = 3;

// 按概率随机抽取一个道具
function randomItem(){
  var totalWeight = 0;
  for(var i = 0; i < ITEM_POOL.length; i++){
    totalWeight += ITEM_POOL[i].weight;
  }
  var r = Math.random() * totalWeight;
  var cumulative = 0;
  for(var i = 0; i < ITEM_POOL.length; i++){
    cumulative += ITEM_POOL[i].weight;
    if(r < cumulative){
      return ITEM_POOL[i];
    }
  }
  return ITEM_POOL[ITEM_POOL.length - 1];
}

function createSlot(x, y, item){
  var it = item || randomItem();
  var q = it.quality;
  var slot = document.createElement('div');
  slot.className = 'item-slot quality-' + q;
  slot.style.left = x + 'px';
  slot.style.top = y + 'px';
  // 黑色小方块背景
  var slotBg = document.createElement('img');
  slotBg.className = 'slot-bg';
  slotBg.src = SLOT_IMAGES[q];
  slot.appendChild(slotBg);
  // 道具图片（如果有）
  if(it.image){
    var itemImg = document.createElement('img');
    itemImg.className = 'item-img';
    itemImg.src = it.image;
    slot.appendChild(itemImg);
  }
  // 道具名称
  var itemName = document.createElement('div');
  itemName.className = 'item-name';
  itemName.textContent = it.name || '';
  slot.appendChild(itemName);
  if(q === 'gold') createGoldParticles(slot);
  slot.item = it;
  return slot;
}

// 出货动画预加载状态
var showcasePreloaded = false;
var preloadedShowcaseItem = null;
var preloadedShowcaseCallback = null;

// 预加载出货动画（视频播放期间调用，modal保持隐藏，只加载iframe和第一张背景图）
function preloadShowcase(itemName, itemImage, callback){
  if(showcasePreloaded) return; // 已经预加载过了
  showcasePreloaded = true;
  preloadedShowcaseItem = {name: itemName, image: itemImage};
  preloadedShowcaseCallback = callback;
  
  var modal = document.getElementById('goldRewardModal');
  var iframe = document.getElementById('goldRewardIframe');
  var tpl = document.getElementById('goldRewardTpl').value;
  
  // 如果没有传入图片，从映射表中查找
  if(!itemImage && SHOWCASE_IMAGES[itemName]){
    itemImage = SHOWCASE_IMAGES[itemName];
    preloadedShowcaseItem.image = itemImage;
  }
  
  iframe.srcdoc = tpl;
  // modal保持隐藏，不显示
  modal.style.display = 'none';
  
  iframe.onload = function(){
    try{
      var bgImages = SHOWCASE_BG_IMAGES[itemName] || null;
      // 发送setItemName消息，iframe会设置道具信息和第一张背景图，但不开始计时
      iframe.contentWindow.postMessage({type:'setItemName', name:itemName, image:itemImage, bgStart: bgImages ? bgImages.bgStart : null, bgButton: bgImages ? bgImages.bgButton : null}, '*');
    }catch(e){}
  };
  
  // 监听关闭消息（预加载阶段也需要监听，防止用户操作）
  var messageHandler = function(e){
    if(e.data && e.data.type === 'closeGoldReward'){
      window.removeEventListener('message', messageHandler);
      iframe.onload = null;
      modal.style.display = 'none';
      isShowcasePlaying = false;
      showcasePreloaded = false;
      // 关键：调用全局变量preloadedShowcaseCallback，而不是闭包变量callback
      // 因为showGoldReward中会把playTen的callback保存到preloadedShowcaseCallback
      if(preloadedShowcaseCallback) preloadedShowcaseCallback();
    }
  };
  window.addEventListener('message', messageHandler);
}

// 显示已经预加载好的出货动画（视频结束后调用，显示modal并开始计时）
function showPreloadedShowcase(){
  if(!showcasePreloaded || !preloadedShowcaseItem) return false;
  
  var modal = document.getElementById('goldRewardModal');
  var iframe = document.getElementById('goldRewardIframe');
  
  // 显示modal
  modal.style.display = 'block';
  
  // 发送startShowcaseTiming信号，让iframe开始出货动画计时
  setTimeout(function(){
    try{
      iframe.contentWindow.postMessage({type:'startShowcaseTiming'}, '*');
    }catch(e){}
  }, 50);
  
  // 设置出货动画播放状态锁
  isShowcasePlaying = true;
  
  return true;
}

function showGoldReward(itemName, callback, itemImage){
  // 如果已经预加载好了，直接显示并开始计时
  if(showcasePreloaded && preloadedShowcaseItem && preloadedShowcaseItem.name === itemName){
    // 关键：把callback保存到全局变量，出货动画结束后messageHandler会调用
    preloadedShowcaseCallback = callback;
    showPreloadedShowcase();
    return;
  }
  
  // 没有预加载，执行原来的逻辑
  // 设置出货动画播放状态锁
  isShowcasePlaying = true;
  var modal = document.getElementById('goldRewardModal');
  var iframe = document.getElementById('goldRewardIframe');
  var tpl = document.getElementById('goldRewardTpl').value;
  // 如果没有传入图片，从映射表中查找
  if(!itemImage && SHOWCASE_IMAGES[itemName]){
    itemImage = SHOWCASE_IMAGES[itemName];
  }
  
  iframe.srcdoc = tpl;
  modal.style.display = 'block';
  
  iframe.onload = function(){
    try{
      var bgImages = SHOWCASE_BG_IMAGES[itemName] || null;
      iframe.contentWindow.postMessage({type:'setItemName', name:itemName, image:itemImage, bgStart: bgImages ? bgImages.bgStart : null, bgButton: bgImages ? bgImages.bgButton : null}, '*');
      // 没有预加载的情况下，setItemName后需要立即开始计时（兼容普通模式）
      setTimeout(function(){
        try{
          iframe.contentWindow.postMessage({type:'startShowcaseTiming'}, '*');
        }catch(e){}
      }, 100);
    }catch(e){}
  };
  
  var messageHandler = function(e){
    if(e.data && e.data.type === 'closeGoldReward'){
      window.removeEventListener('message', messageHandler);
      iframe.onload = null;
      modal.style.display = 'none';
      // 释放出货动画播放状态锁
      isShowcasePlaying = false;
      showcasePreloaded = false;
      if(callback) callback();
    }
  };
  window.addEventListener('message', messageHandler);
}

async function playTen(){
  // 防止重复播放
  if(animationStarted) return;
  animationStarted = true;

  bgImg.src = BG_TEN;
  slotsContainer.innerHTML = '';
  gachaResults = [];
  var slots = [];
  var items = [];
  
  // 优先级：1. 从localStorage读取（最可靠，不受file://沙箱限制）
  //         2. 从父页面内存读取lastTenItems
  //         3. postMessage传递的externalTenItems
  //         4. 随机道具（兜底）
  var storageItems = null;
  try{
    var stored = localStorage.getItem('lastTenItems');
    if(stored){
      storageItems = JSON.parse(stored);
    }
  }catch(e){}
  
  var parentItems = null;
  try{
    if(window.parent && window.parent.lastTenItems && window.parent.lastTenItems.length > 0){
      parentItems = window.parent.lastTenItems;
    }
  }catch(e){}
  
  if(storageItems && storageItems.length > 0){
    items = storageItems.slice();
  }else if(parentItems && parentItems.length > 0){
    items = parentItems.slice();
  }else if(externalTenItems && externalTenItems.length > 0){
    items = externalTenItems.slice();
  }else{
    for(var i = 0; i < 10; i++){
      items.push(randomItem());
    }
  }
  
  // 按照品质排序道具：紫色 → 白色 → 金色，同品质内保持原顺序
  var qualityOrder = {red: -1, purple: 1, white: 2, gold: 0};
  items.sort(function(a, b){
    var qa = qualityOrder[a.quality] || 99;
    var qb = qualityOrder[b.quality] || 99;
    return qa - qb;
  });
  
  // 创建10个道具格子（按照排序后的顺序，从左到右、从上到下放置）
  for(var i = 0; i < 10; i++){
    var slot = createSlot(tenPositions[i].x, tenPositions[i].y, items[i]);
    slotsContainer.appendChild(slot);
    slots.push(slot);
    gachaResults.push(slot.item);
  }
  
  // 逐个揭示道具（按照格子顺序，也就是品质顺序）
  for(var i = 0; i < tenOrder.length; i++){
    var idx = tenOrder[i];
    var item = items[idx];
    
    // 如果是有出货动画的金色道具，先播放出货动画
    if(needShowcase(item)){
      await new Promise(function(resolve){
        showGoldReward(item.name, function(){
          setTimeout(resolve, 50);
        });
      });
    }
    
    // 出货动画确认后（或不需要出货动画），道具才飞入
    slots[idx].classList.add('fly-in');
    
    // 等待300ms
    await new Promise(function(r){ setTimeout(r, 100); });
  }
}

}

// 确认按钮关闭
document.getElementById('confirmBtn').addEventListener('click', function(){
  playClickSound(); // 播放点击音效
  // 如果出货动画正在播放，忽略点击，防止跳过出货动画
  if(isShowcasePlaying) return;
  // 统计获得的离恨烟兑换币
  var pointsEarned = 0;
  for(var i = 0; i < gachaResults.length; i++){
    var item = gachaResults[i];
    if(item && item.name && item.name.indexOf('离恨烟兑换币') !== -1){
      // 从名称中提取数字，如"离恨烟兑换币×15" -> 15
      var numStr = item.name.replace('离恨烟兑换币×', '').replace('离恨烟兑换币*', '').replace('离恨烟兑换币', '');
      var num = parseInt(numStr);
      if(!isNaN(num)){
        pointsEarned += num;
      }
    }
  }
  // 收集所有奖励
  var rewards = [];
  for(var i = 0; i < gachaResults.length; i++){
    var item = gachaResults[i];
    if(item && item.name){
      rewards.push(item);
    }
  }
  window.parent.postMessage({type:'gachaClose', points: pointsEarned, rewards: rewards}, '*');
});

// 十连抽页面，等待父页面传递道具后播放
window.onload = function(){
  // 页面加载时先缩放
  layout();
  
  // 关键：不依赖父页面的startAnimation信号，页面加载完成后自己检查localStorage
  // 如果有lastTenItems道具数据，就自动播放（延迟50ms确保页面完全就绪）
  try{
    var stored = localStorage.getItem('lastTenItems');
    if(stored){
      var items = JSON.parse(stored);
      if(items && items.length > 0){
        setTimeout(function(){
          if(!animationStarted){
            playTen();
          }
        }, 50);
      }
    }
  }catch(e){}
  
  // 同时也向父页面发送"请求道具"消息，作为备用
  try{
    window.parent.postMessage({type: 'requestTenRewards'}, '*');
  }catch(e){}
};
</script>
